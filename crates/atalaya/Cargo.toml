[package]
name = "atalaya"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
atalaya-core = { path = "../atalaya-core" }
clap = { version = "4.6.9", features = ["derive"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
