[package]
name = "atalaya-core"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
mysql = { version = "28.0.4", default-features = false, features = ["minimal", "native-tls"] }
native-tls = "0.2.18"
postgres = "0.19.14"
postgres-native-tls = "0.5.3"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
